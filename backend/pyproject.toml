[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MinaPulse"
version = "0.1.0"
description = "API con FastAPI y SQLAlchemy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",   # PostgreSQL (Cloud SQL)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",     # para probar endpoints
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
